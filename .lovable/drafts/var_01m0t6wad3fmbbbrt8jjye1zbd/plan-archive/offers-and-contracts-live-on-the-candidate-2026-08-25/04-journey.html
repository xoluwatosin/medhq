<svg viewBox="0 0 640 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Offer to signed contract, all started from the candidate profile">
<style>
text{font-family:var(--font-sans);fill:hsl(var(--foreground))}
.s{font-size:12px;fill:hsl(var(--muted-foreground))}
.l{font-size:14px;font-weight:480}
.b{fill:none;stroke:hsl(var(--muted-foreground));stroke-width:1}
.w{stroke:hsl(var(--muted-foreground));stroke-width:1;fill:none}
.z{fill:none;stroke:hsl(var(--border));stroke-width:1;stroke-dasharray:4 3}
</style>
<defs><marker id="c" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="hsl(var(--muted-foreground))"/></marker></defs>

<rect x="14" y="54" width="120" height="46" rx="8" fill="hsl(var(--accent))" stroke="hsl(var(--muted-foreground))"/>
<text class="l" x="74" y="74" text-anchor="middle" fill="hsl(var(--accent-foreground))">Offer</text>
<text class="s" x="74" y="91" text-anchor="middle" fill="hsl(var(--accent-foreground))">pre-filled</text>

<line class="w" x1="134" y1="77" x2="172" y2="77" marker-end="url(#c)"/>
<rect class="b" x="176" y="54" width="118" height="46" rx="8"/>
<text class="l" x="235" y="74" text-anchor="middle">Accepted</text>
<text class="s" x="235" y="91" text-anchor="middle">in their portal</text>

<line class="w" x1="294" y1="77" x2="332" y2="77" marker-end="url(#c)"/>
<rect class="b" x="336" y="54" width="118" height="46" rx="8"/>
<text class="l" x="395" y="74" text-anchor="middle">Contract</text>
<text class="s" x="395" y="91" text-anchor="middle">terms carried over</text>

<line class="w" x1="454" y1="77" x2="492" y2="77" marker-end="url(#c)"/>
<rect class="b" x="496" y="54" width="128" height="46" rx="8"/>
<text class="l" x="560" y="74" text-anchor="middle">Signed and filed</text>
<text class="s" x="560" y="91" text-anchor="middle">on their documents</text>

<rect class="z" x="14" y="130" width="610" height="96" rx="8"/>
<text class="s" x="30" y="154">Every step above is started and read from one tab on this candidate's profile.</text>
<text class="s" x="30" y="176">Nothing asks you to choose the person again, and no term is typed twice.</text>
<text class="s" x="30" y="198">The whole trail, offer through signature, stays on the record afterwards.</text>
</svg>
