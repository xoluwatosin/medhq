<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Engagement established once, with many work offers underneath it">
<style>
text{font-family:var(--font-sans);fill:hsl(var(--foreground))}
.s{font-size:12px;fill:hsl(var(--muted-foreground))}
.m{font-size:12px;font-family:var(--font-mono);fill:hsl(var(--muted-foreground))}
.l{font-size:14px;font-weight:480}
.b{fill:none;stroke:hsl(var(--muted-foreground));stroke-width:1}
.r{stroke:hsl(var(--border));stroke-width:1}
.z{fill:none;stroke:hsl(var(--border));stroke-width:1;stroke-dasharray:4 3}
</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="hsl(var(--muted-foreground))" stroke-width="1"/></marker></defs>

<text class="s" x="0" y="14">layer one — the engagement, one continuous record</text>
<rect class="z" x="0" y="24" width="640" height="86" rx="8"/>
<g>
  <rect class="b" x="16" y="44" width="108" height="38" rx="8"/><text class="l" x="70" y="68" text-anchor="middle">Terms drafted</text>
  <rect class="b" x="146" y="44" width="108" height="38" rx="8"/><text class="l" x="200" y="68" text-anchor="middle">Sent</text>
  <rect class="b" x="276" y="44" width="108" height="38" rx="8"/><text class="l" x="330" y="68" text-anchor="middle">Accepted</text>
  <rect x="406" y="44" width="108" height="38" rx="8" fill="hsl(var(--accent))" stroke="none"/><text class="l" x="460" y="68" text-anchor="middle" fill="hsl(var(--accent-foreground))">Signed</text>
  <rect class="b" x="536" y="44" width="88" height="38" rx="8"/><text class="l" x="580" y="68" text-anchor="middle">Live</text>
  <line class="b" x1="124" y1="63" x2="144" y2="63" marker-end="url(#a)"/>
  <line class="b" x1="254" y1="63" x2="274" y2="63" marker-end="url(#a)"/>
  <line class="b" x1="384" y1="63" x2="404" y2="63" marker-end="url(#a)"/>
  <line class="b" x1="514" y1="63" x2="534" y2="63" marker-end="url(#a)"/>
</g>
<text class="s" x="16" y="100">no rebuild at acceptance — the document is drafted from the terms already agreed</text>

<text class="s" x="0" y="140">layer two — work offered under a live engagement, no new paper</text>
<line class="r" x1="0" y1="150" x2="640" y2="150"/>
<g>
  <rect class="r" fill="hsl(var(--muted))" x="0" y="164" width="204" height="76" rx="8"/>
  <text class="l" x="16" y="188">Shift offer</text>
  <text class="s" x="16" y="208">a date, hours, a rate</text>
  <text class="s" x="16" y="226">accept or decline in the portal</text>

  <rect class="r" fill="hsl(var(--muted))" x="218" y="164" width="204" height="76" rx="8"/>
  <text class="l" x="234" y="188">Assignment offer</text>
  <text class="s" x="234" y="208">a run of dates or a rota</text>
  <text class="s" x="234" y="226">one rate for the run</text>

  <rect class="r" fill="hsl(var(--muted))" x="436" y="164" width="204" height="76" rx="8"/>
  <text class="l" x="452" y="188">Rota allocation</text>
  <text class="s" x="452" y="208">for salaried staff</text>
  <text class="s" x="452" y="226">booked, not negotiated</text>
</g>

<text class="s" x="0" y="272">engagement types and what they cover</text>
<g>
  <text class="m" x="0" y="294">employment</text><text class="s" x="120" y="294">salary, notice, probation — shifts sit under it, no per-shift paper</text>
  <text class="m" x="0" y="312">placement</text><text class="s" x="120" y="312">fixed term with a client or facility, ends on a date</text>
  <text class="m" x="0" y="330">bank / locum</text><text class="s" x="120" y="330">scope and period, rates per shift agreed offer by offer</text>
</g>
</svg>
