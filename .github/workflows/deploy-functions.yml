# Deploys Supabase edge functions when their code changes on the live branch,
# the way Vercel deploys the website. Only the functions a push touched are
# deployed: a function whose own files, or a shared file it imports, changed.
# Each function's login rule (verify_jwt) comes from supabase/config.toml.
#
# Needs one repository secret, SUPABASE_ACCESS_TOKEN (a Supabase personal
# access token). Without it the workflow says so and stops without failing.
name: Deploy edge functions

on:
  push:
    branches: [claude/stoic-clarke-xwp2ql]
    paths: ["supabase/functions/**", "supabase/config.toml"]
  workflow_dispatch:
    inputs:
      functions:
        description: "Functions to deploy, space separated, or 'all'"
        required: true
        default: ""

concurrency:
  group: deploy-functions
  cancel-in-progress: false

env:
  PROJECT_REF: zeqiewxlqcmbgvytnahl

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the access token is set
        id: token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::SUPABASE_ACCESS_TOKEN is not set, so nothing was deployed."
            echo "ready=no" >> "$GITHUB_OUTPUT"
          else
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Work out which functions changed
        id: changed
        if: steps.token.outputs.ready == 'yes'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          REQUESTED: ${{ github.event.inputs.functions }}
        run: python3 .github/scripts/changed-functions.py >> "$GITHUB_OUTPUT"

      - uses: supabase/setup-cli@v1
        if: steps.token.outputs.ready == 'yes' && steps.changed.outputs.functions != ''
        with:
          version: latest

      - name: Deploy
        if: steps.token.outputs.ready == 'yes' && steps.changed.outputs.functions != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          FUNCTIONS: ${{ steps.changed.outputs.functions }}
        run: |
          for fn in $FUNCTIONS; do
            echo "Deploying $fn"
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF"
          done
